// Ground-truth input for the Gradle subject: the artifacts Gradle itself RESOLVED for each configuration,
// one "group:artifact:version" per line, read through Gradle's own resolution API (not by parsing its tree output).
// Run with:  ./gradlew --no-configuration-cache --init-script p16-resolved.init.gradle p16Resolved
allprojects {
    tasks.register("p16Resolved") {
        doLast {
            def outDir = new File(System.getenv("P16_GT_DIR") ?: "/gt")
            outDir.mkdirs()
            // productionRuntimeClasspath (Spring Boot plugin) = runtimeClasspath minus developmentOnly = what bootJar packs
            ["runtimeClasspath", "productionRuntimeClasspath", "testRuntimeClasspath", "developmentOnly",
             "checkstyle"].each { name ->
                def conf = project.configurations.findByName(name)
                if (conf == null || !conf.canBeResolved) {
                    return
                }
                def lines = conf.incoming.artifacts.artifacts.collect { result ->
                    def id = result.id.componentIdentifier
                    (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) ?
                        "${id.group}:${id.module}:${id.version}" : null
                }.findAll { it != null }.unique().sort()
                new File(outDir, "gradle-${name}.txt").text = lines.join("\n") + "\n"
            }
        }
    }
}
