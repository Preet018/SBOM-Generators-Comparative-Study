  - {id: X-postgres, subject: public-postgres, ecosystem: os, stage: S3, kind: image, how: pull, image: "postgres:17@sha256:223efeb196329b55b3b9a13db144956411dbc18e727e59f681c3e0aede6475cf"}
  - {id: X-mysql, subject: public-mysql, ecosystem: os, stage: S3, kind: image, how: pull, image: "mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902"}
  - {id: X-jenkins, subject: public-jenkins, ecosystem: java, stage: S3, kind: image, how: pull, image: "jenkins/jenkins:lts-jdk21@sha256:74401de6a6f92e1afe1b02d1c8e3d0c33f263bfb5275dd8813f9150355f2367b"}
  - {id: X-keycloak, subject: public-keycloak, ecosystem: java, stage: S3, kind: image, how: pull, image: "quay.io/keycloak/keycloak:latest@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3"}
  - {id: X-ghost, subject: public-ghost, ecosystem: npm, stage: S3, kind: image, how: pull, image: "ghost:6-alpine@sha256:baa6dbff91a28ba36c526d1f6e761deb2efe3c238c630c3f318b62f258c2d76e"}
  - {id: X-airflow, subject: public-airflow, ecosystem: python, stage: S3, kind: image, how: pull, image: "apache/airflow:slim-latest@sha256:371c258d67cd0a34bac60a28c940b65968b98dff2554e12b981f1df75b4be570"}
